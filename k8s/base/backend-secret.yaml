apiVersion: v1
kind: Secret
metadata:
  name: app-secrets
  labels:
    app: backend
type: Opaque
stringData:
  # DEV-ONLY defaults — production credentials are injected via
  # k8s/overlays/prod/patches/secret.yaml generated from GitHub Secrets
  # (DB_USERNAME / DB_PASSWORD / PHRASAL_ADMIN_EMAIL / PHRASAL_ADMIN_PASSWORD /
  # MAIL_USERNAME / MAIL_PASSWORD / TOTP_ENCRYPTION_KEY / GOOGLE_CLIENT_ID / GOOGLE_CLIENT_SECRET) during the deploy
  # workflow.
  # TODO: rotate prod credentials if still using postgres/postgres defaults.
  database.username: postgres
  database.password: postgres
  admin.email: admin@phrasal.test
  admin.password: admin-dev-password
  mail.username: ""
  mail.password: ""
  totp.encryption-key: PmFzMN5xUKzq7Tmm5uLwwIUBV6CDsU/ugcghKiDh3/E=
  # Empty: Google sign-in is off in the dev overlay
  google.client-id: ""
  google.client-secret: ""

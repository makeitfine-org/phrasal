apiVersion: v1
kind: ConfigMap
metadata:
  name: app-config
  labels:
    app: backend
data:
  database.url: jdbc:postgresql://postgres-service:5432/phrasaldb
  spring.profiles.active: dev
  server.port: "8080"
  mail.enabled: "false"
  mail.host: mailpit-not-deployed
  mail.port: "1025"
  mail.from: "Phrasal <no-reply@phrasalbox.com>"
  app.base-url: http://localhost:3000
  # The dev overlay has no Google stand-in, so Google sign-in stays off (prod turns it on)
  google.enabled: "false"

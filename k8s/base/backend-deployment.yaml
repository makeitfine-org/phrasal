apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  labels:
    app: backend
spec:
  replicas: 2
  revisionHistoryLimit: 5
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      initContainers:
      - name: wait-for-postgres
        image: postgres:16-alpine
        command: ['sh', '-c', 'until pg_isready -h postgres-service -p 5432; do echo "waiting for postgres"; sleep 2; done']
      containers:
      - name: backend
        image: backend
        ports:
        - containerPort: 8080
          name: http
        env:
        - name: SPRING_PROFILES_ACTIVE
          valueFrom:
            configMapKeyRef:
              name: app-config
              key: spring.profiles.active
        - name: DATABASE_URL
          valueFrom:
            configMapKeyRef:
              name: app-config
              key: database.url
        - name: DATABASE_USER
          valueFrom:
            secretKeyRef:
              name: app-secrets
              key: database.username
        - name: DATABASE_PASSWORD
          valueFrom:
            secretKeyRef:
              name: app-secrets
              key: database.password
        - name: PHRASAL_ADMIN_EMAIL
          valueFrom:
            secretKeyRef:
              name: app-secrets
              key: admin.email
        - name: PHRASAL_ADMIN_PASSWORD
          valueFrom:
            secretKeyRef:
              name: app-secrets
              key: admin.password
        - name: SERVER_PORT
          valueFrom:
            configMapKeyRef:
              name: app-config
              key: server.port
        - name: MAIL_ENABLED
          valueFrom:
            configMapKeyRef:
              name: app-config
              key: mail.enabled
        - name: MAIL_HOST
          valueFrom:
            configMapKeyRef:
              name: app-config
              key: mail.host
        - name: MAIL_PORT
          valueFrom:
            configMapKeyRef:
              name: app-config
              key: mail.port
        - name: PHRASAL_MAIL_FROM
          valueFrom:
            configMapKeyRef:
              name: app-config
              key: mail.from
        - name: APP_BASE_URL
          valueFrom:
            configMapKeyRef:
              name: app-config
              key: app.base-url
        - name: MAIL_USERNAME
          valueFrom:
            secretKeyRef:
              name: app-secrets
              key: mail.username
        - name: MAIL_PASSWORD
          valueFrom:
            secretKeyRef:
              name: app-secrets
              key: mail.password
        - name: TOTP_ENCRYPTION_KEY
          valueFrom:
            secretKeyRef:
              name: app-secrets
              key: totp.encryption-key
        livenessProbe:
          httpGet:
            path: /actuator/health/liveness
            port: 8080
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /actuator/health/readiness
            port: 8080
          initialDelaySeconds: 20
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3
        resources:
          requests:
            memory: "512Mi"
            cpu: "500m"
          limits:
            memory: "1Gi"
            cpu: "1000m"
      restartPolicy: Always

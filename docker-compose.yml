services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: phrasaldb
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - app-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: phrasal-backend
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: dev
      DATABASE_URL: jdbc:postgresql://postgres:5432/phrasaldb
      DATABASE_USER: postgres
      DATABASE_PASSWORD: postgres
      # Dev-only admin account, created at startup. Override via .env; never use these in production.
      PHRASAL_ADMIN_EMAIL: ${PHRASAL_ADMIN_EMAIL:-admin@phrasal.test}
      PHRASAL_ADMIN_PASSWORD: ${PHRASAL_ADMIN_PASSWORD:-admin-dev-password}
      SESSION_COOKIE_SECURE: "false"
      # e2e registers many users from one IP; the per-email login limit stays at its default
      RATE_LIMIT_REGISTER_PER_IP: "1000"
      RATE_LIMIT_LOGIN_PER_IP: "1000"
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    networks:
      - app-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget --quiet --tries=1 --spider http://localhost:8080/actuator/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    image: phrasal-frontend
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${FRONTEND_PORT:-3000}:80"
    networks:
      - app-network
    restart: unless-stopped

networks:
  app-network:
    driver: bridge

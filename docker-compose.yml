services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: phrasaldb
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - phrase-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - app-network

  mailpit:
    image: axllent/mailpit:v1.32.0
    ports:
      - "${MAILPIT_SMTP_PORT:-1025}:1025"
      - "${MAILPIT_UI_PORT:-8025}:8025"
    environment:
      MP_MAX_MESSAGES: 500
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - app-network

  mock-oauth2:
    # Stands in for Google locally and in e2e, like Mailpit stands in for Brevo. Its login form accepts any username
    # (the subject) and extra claims as JSON, e.g. {"email": "a@b.test", "email_verified": true}.
    image: ghcr.io/navikt/mock-oauth2-server:6.1.1
    ports:
      - "${MOCK_OAUTH2_PORT:-8090}:8080"
    environment:
      JSON_CONFIG: '{"interactiveLogin": true}'
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8080/isalive"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - app-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: phrasal-backend
    depends_on:
      postgres:
        condition: service_healthy
      mailpit:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: dev
      DATABASE_URL: jdbc:postgresql://postgres:5432/phrasaldb
      DATABASE_USER: postgres
      DATABASE_PASSWORD: postgres
      # Dev-only admin account, created at startup. Override via .env; never use these in production.
      PHRASAL_ADMIN_EMAIL: ${PHRASAL_ADMIN_EMAIL:-admin@phrasal.test}
      PHRASAL_ADMIN_PASSWORD: ${PHRASAL_ADMIN_PASSWORD:-admin-dev-password}
      # DEV ONLY: base64 of 32 bytes; production uses the TOTP_ENCRYPTION_KEY GitHub Secret
      TOTP_ENCRYPTION_KEY: ${TOTP_ENCRYPTION_KEY:-PmFzMN5xUKzq7Tmm5uLwwIUBV6CDsU/ugcghKiDh3/E=}
      SESSION_COOKIE_SECURE: "false"
      MAIL_ENABLED: "true"
      MAIL_HOST: mailpit
      MAIL_PORT: "1025"
      # The frontend origin; email links and the Google redirect URI start with it
      APP_BASE_URL: ${APP_BASE_URL:-http://localhost:${FRONTEND_PORT:-3000}}
      # Google sign-in against the mock-oauth2 service. For real Google: put GOOGLE_CLIENT_ID and GOOGLE_CLIENT_SECRET in
      # .env and set the GOOGLE_*_URI variables to empty values ("GOOGLE_TOKEN_URI="). The browser reaches the mock on
      # localhost; the backend reaches it as mock-oauth2:8080, which is also the host the mock puts into the issuer.
      GOOGLE_LOGIN_ENABLED: ${GOOGLE_LOGIN_ENABLED:-true}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-phrasal-local}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-phrasal-local-secret}
      GOOGLE_AUTHORIZATION_URI: ${GOOGLE_AUTHORIZATION_URI-http://localhost:${MOCK_OAUTH2_PORT:-8090}/default/authorize}
      GOOGLE_TOKEN_URI: ${GOOGLE_TOKEN_URI-http://mock-oauth2:8080/default/token}
      GOOGLE_JWK_SET_URI: ${GOOGLE_JWK_SET_URI-http://mock-oauth2:8080/default/jwks}
      GOOGLE_ISSUER_URI: ${GOOGLE_ISSUER_URI-http://mock-oauth2:8080/default}
      # e2e must not depend on api.pwnedpasswords.com
      PASSWORD_BREACH_CHECK_ENABLED: "false"
      # e2e registers many users from one IP; the per-account 2FA limit stays at its default; the per-email login limit (shared with 2FA setup) is 10 because the shared admin logs in and enrolls several times per run
      RATE_LIMIT_REGISTER_PER_IP: "1000"
      RATE_LIMIT_REGISTER_PER_EMAIL: "1000"
      RATE_LIMIT_LOGIN_PER_IP: "1000"
      RATE_LIMIT_LOGIN_PER_EMAIL: "10"
      RATE_LIMIT_VERIFY_PER_IP: "1000"
      RATE_LIMIT_RESEND_PER_IP: "1000"
      RATE_LIMIT_FORGOT_PER_IP: "1000"
      RATE_LIMIT_RESET_PER_IP: "1000"
      RATE_LIMIT_TWO_FACTOR_PER_IP: "1000"
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    networks:
      - app-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget --quiet --tries=1 --spider http://localhost:8080/actuator/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    image: phrasal-frontend
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${FRONTEND_PORT:-3000}:80"
    networks:
      - app-network
    restart: unless-stopped

volumes:
  phrase-postgres-data:
    name: phrase-postgres-data

networks:
  app-network:
    driver: bridge

spring:
  jpa:
    show-sql: true

logging:
  level:
    net.phrasal: DEBUG

phrasal:
  mail:
    enabled: false
  rate-limit:
    register-per-ip:
      limit: 100000
    login-per-ip:
      limit: 100000
    login-per-email:
      limit: 100000
    resend-per-ip:
      limit: 100000
    resend-per-email:
      limit: 100000
    verify-per-ip:
      limit: 100000

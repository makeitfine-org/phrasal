spring:
  datasource:
    url: ${DATABASE_URL}
    username: ${DATABASE_USER}
    password: ${DATABASE_PASSWORD}
    hikari:
      maximum-pool-size: 5
      minimum-idle: 2

  jpa:
    show-sql: false

  flyway:
    enabled: true

server:
  port: ${SERVER_PORT:8080}
  servlet:
    session:
      cookie:
        secure: true

logging:
  level:
    net.phrasal: INFO
    org.hibernate.SQL: WARN

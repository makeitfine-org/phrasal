spring:
  application:
    name: backend
  threads:
    virtual:
      enabled: true

  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    default-encoding: UTF-8
    properties:
      mail.smtp.auth: ${MAIL_SMTP_AUTH:false}
      mail.smtp.starttls.enable: ${MAIL_SMTP_STARTTLS:false}
      mail.smtp.connectiontimeout: 5000
      mail.smtp.timeout: 5000
      mail.smtp.writetimeout: 5000

  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/phrasaldb}
    username: ${DATABASE_USER:postgres}
    password: ${DATABASE_PASSWORD:postgres}
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
      connection-timeout: 20000
      idle-timeout: 300000

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        jdbc:
          batch_size: 20
        order_inserts: true
        order_updates: true

  session:
    jdbc:
      initialize-schema: never

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

server:
  port: 8080
  shutdown: graceful
  forward-headers-strategy: native
  servlet:
    session:
      timeout: ${SESSION_TIMEOUT:7d}
      cookie:
        http-only: true
        same-site: lax
        secure: ${SESSION_COOKIE_SECURE:false}
  error:
    include-message: always
    include-binding-errors: always

phrasal:
  security:
    admin:
      email: ${PHRASAL_ADMIN_EMAIL:}
      password: ${PHRASAL_ADMIN_PASSWORD:}

  rate-limit:
    enabled: ${RATE_LIMIT_ENABLED:true}
    register-per-ip:
      limit: ${RATE_LIMIT_REGISTER_PER_IP:5}
      window: 1h
    register-per-email:
      limit: ${RATE_LIMIT_REGISTER_PER_EMAIL:3}
      window: 1h
    login-per-ip:
      limit: ${RATE_LIMIT_LOGIN_PER_IP:20}
      window: 5m
    login-per-email:
      limit: ${RATE_LIMIT_LOGIN_PER_EMAIL:5}
      window: 5m
    resend-per-ip:
      limit: ${RATE_LIMIT_RESEND_PER_IP:10}
      window: 1h
    resend-per-email:
      limit: ${RATE_LIMIT_RESEND_PER_EMAIL:3}
      window: 1h
    verify-per-ip:
      limit: ${RATE_LIMIT_VERIFY_PER_IP:30}
      window: 5m
    forgot-per-ip:
      limit: ${RATE_LIMIT_FORGOT_PER_IP:10}
      window: 1h
    forgot-per-email:
      limit: ${RATE_LIMIT_FORGOT_PER_EMAIL:3}
      window: 1h
    reset-per-ip:
      limit: ${RATE_LIMIT_RESET_PER_IP:30}
      window: 5m
    two-factor-per-ip:
      limit: ${RATE_LIMIT_TWO_FACTOR_PER_IP:20}
      window: 5m
    two-factor-per-user:
      limit: ${RATE_LIMIT_TWO_FACTOR_PER_USER:5}
      window: 15m
    reauth-per-user:
      limit: ${RATE_LIMIT_REAUTH_PER_USER:5}
      window: 15m
    email-change-per-email:
      limit: ${RATE_LIMIT_EMAIL_CHANGE_PER_EMAIL:3}
      window: 1h
  quiz-progress:
    max-state-bytes: 65536
  app:
    base-url: ${APP_BASE_URL:http://localhost:3000}
  mail:
    enabled: ${MAIL_ENABLED:false}
    from: ${PHRASAL_MAIL_FROM:Phrasal <no-reply@phrasalbox.com>}
  email-verification:
    token-ttl: ${EMAIL_VERIFICATION_TOKEN_TTL:24h}
    unverified-account-retention: ${UNVERIFIED_ACCOUNT_RETENTION:7d}
  password-reset:
    token-ttl: ${PASSWORD_RESET_TOKEN_TTL:1h}
  email-change:
    token-ttl: ${EMAIL_CHANGE_TOKEN_TTL:1h}
  password:
    breach-check:
      enabled: ${PASSWORD_BREACH_CHECK_ENABLED:true}
      timeout: ${PASSWORD_BREACH_CHECK_TIMEOUT:2s}
  two-factor:
    # base64 of 32 random bytes (openssl rand -base64 32); the app does not start without it
    encryption-key: ${TOTP_ENCRYPTION_KEY:}
    issuer: ${TWO_FACTOR_ISSUER:Phrasal}
    login-timeout: ${TWO_FACTOR_LOGIN_TIMEOUT:5m}
  google:
    # "Sign in with Google"; with true, a blank client id or secret fails startup
    enabled: ${GOOGLE_LOGIN_ENABLED:false}
    client-id: ${GOOGLE_CLIENT_ID:}
    client-secret: ${GOOGLE_CLIENT_SECRET:}
    # Overrides for a stand-in provider (docker-compose mock). Empty = Google's own endpoints.
    authorization-uri: ${GOOGLE_AUTHORIZATION_URI:}
    token-uri: ${GOOGLE_TOKEN_URI:}
    jwk-set-uri: ${GOOGLE_JWK_SET_URI:}
    issuer-uri: ${GOOGLE_ISSUER_URI:}
    user-info-uri: ${GOOGLE_USER_INFO_URI:}

management:
  health:
    mail:
      # a slow SMTP relay must not mark the backend DOWN
      enabled: false
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true

logging:
  level:
    net.phrasal: INFO
